openapi: 3.0.3
info:
  title: Transaction Ledger API
  version: 1.0.0
  description: |
    Accounts, credit/debit transactions, balances, paginated history and atomic transfers.

    **Conventions**
    - Success responses wrap the payload in `data`.
    - Errors always look like `{ "error": { "code", "message", "details?" } }`.
    - Amounts are JSON numbers with at most 2 decimal places, `0 < amount <= 1,000,000,000`.
    - Transactions are immutable: there are no update/delete endpoints (`PUT/PATCH/DELETE` return `405`).
servers:
  - url: http://localhost:3000
tags:
  - name: Accounts
  - name: Transactions
  - name: Transfers

paths:
  /api/accounts:
    post:
      tags: [Accounts]
      summary: Create an account
      description: The balance always starts at 0. Any field other than `name` is rejected.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name]
              properties:
                name: { type: string, minLength: 1, maxLength: 255, example: Alice }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Account' }
        '400': { $ref: '#/components/responses/ValidationError' }
    get:
      tags: [Accounts]
      summary: List accounts (latest 100)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Account' }

  /api/accounts/{accountId}:
    get:
      tags: [Accounts]
      summary: Get an account
      parameters: [{ $ref: '#/components/parameters/AccountId' }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Account' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/AccountNotFound' }

  /api/accounts/{accountId}/balance:
    get:
      tags: [Accounts]
      summary: Get current balance
      parameters: [{ $ref: '#/components/parameters/AccountId' }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      account_id: { type: string, format: uuid }
                      balance: { type: number, example: 150 }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/AccountNotFound' }

  /api/accounts/{accountId}/transactions:
    post:
      tags: [Transactions]
      summary: Add a credit or debit transaction
      description: |
        Balance update and transaction insert happen in a single DB transaction.
        Re-submitting a `reference_id` already used on this account returns `409` and changes nothing.
      parameters: [{ $ref: '#/components/parameters/AccountId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [type, amount, reference_id]
              properties:
                type: { type: string, enum: [credit, debit] }
                amount: { type: number, exclusiveMinimum: true, minimum: 0, maximum: 1000000000, example: 50 }
                description: { type: string, maxLength: 255, example: Salary }
                reference_id: { type: string, minLength: 1, maxLength: 100, example: INV-1001 }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Transaction' }
                  meta:
                    type: object
                    properties:
                      balance: { type: number, description: Account balance after this transaction }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/AccountNotFound' }
        '409':
          description: Duplicate reference_id for this account
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example:
                error:
                  code: DUPLICATE_TRANSACTION
                  message: A transaction with this reference_id already exists for this account
                  details: { existing_transaction: { id: '…', type: credit, amount: 50 } }
        '422': { $ref: '#/components/responses/InsufficientBalance' }
    get:
      tags: [Transactions]
      summary: Transaction history (latest first, filterable, paginated)
      parameters:
        - { $ref: '#/components/parameters/AccountId' }
        - name: type
          in: query
          schema: { type: string, enum: [credit, debit] }
          description: Omit to return both types.
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Transaction' }
                  pagination: { $ref: '#/components/schemas/Pagination' }
                  filters:
                    type: object
                    properties:
                      type: { type: string, nullable: true, enum: [credit, debit] }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/AccountNotFound' }

  /api/transfers:
    post:
      tags: [Transfers]
      summary: Transfer money between two accounts (atomic)
      description: |
        Creates a transfer record, a debit on the source and a credit on the destination in one DB
        transaction; any failure rolls back all of it. `reference_id` is unique per source account
        and makes retries safe.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [from_account_id, to_account_id, amount, reference_id]
              properties:
                from_account_id: { type: string, format: uuid }
                to_account_id: { type: string, format: uuid }
                amount: { type: number, example: 30 }
                description: { type: string, maxLength: 255 }
                reference_id: { type: string, example: TRF-001 }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      transfer: { $ref: '#/components/schemas/Transfer' }
                      debit_transaction: { $ref: '#/components/schemas/Transaction' }
                      credit_transaction: { $ref: '#/components/schemas/Transaction' }
                      balances:
                        type: object
                        additionalProperties: { type: number }
                        description: Balance of each account after the transfer, keyed by account id
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/AccountNotFound' }
        '409':
          description: DUPLICATE_TRANSFER (or DUPLICATE_TRANSACTION if the reference is already used on the source account)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422': { $ref: '#/components/responses/InsufficientBalance' }

  /health:
    get:
      summary: Liveness + DB connectivity
      responses:
        '200':
          description: OK

components:
  parameters:
    AccountId:
      name: accountId
      in: path
      required: true
      schema: { type: string, format: uuid }

  schemas:
    Account:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        balance: { type: number, example: 0 }
        created_at: { type: string, format: date-time }
    Transaction:
      type: object
      properties:
        id: { type: string, format: uuid }
        account_id: { type: string, format: uuid }
        type: { type: string, enum: [credit, debit] }
        amount: { type: number }
        description: { type: string, nullable: true }
        reference_id: { type: string }
        transfer_id: { type: string, format: uuid, nullable: true, description: Set when the entry is one leg of a transfer }
        created_at: { type: string, format: date-time }
    Transfer:
      type: object
      properties:
        id: { type: string, format: uuid }
        from_account_id: { type: string, format: uuid }
        to_account_id: { type: string, format: uuid }
        amount: { type: number }
        description: { type: string, nullable: true }
        reference_id: { type: string }
        created_at: { type: string, format: date-time }
    Pagination:
      type: object
      properties:
        page: { type: integer }
        limit: { type: integer }
        total_records: { type: integer }
        total_pages: { type: integer }
        has_next_page: { type: boolean }
        has_previous_page: { type: boolean }
    Error:
      type: object
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string }
            message: { type: string }
            details: {}

  responses:
    ValidationError:
      description: VALIDATION_ERROR / INVALID_JSON
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            error:
              code: VALIDATION_ERROR
              message: Request body is invalid
              details: [{ field: amount, message: amount must be greater than 0 }]
    AccountNotFound:
      description: ACCOUNT_NOT_FOUND
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    InsufficientBalance:
      description: INSUFFICIENT_BALANCE
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            error:
              code: INSUFFICIENT_BALANCE
              message: Insufficient balance for this debit
              details: { balance: 100, requested_amount: 150 }
